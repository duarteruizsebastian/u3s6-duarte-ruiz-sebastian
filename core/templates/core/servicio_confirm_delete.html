{% extends 'core/base.html' %}
{% block titulo %}Eliminar servicio{% endblock %}
{% block contenido %}
<section class="mx-auto max-w-lg bg-white p-7 rounded-xl border border-slate-200 shadow-sm">
  <h1 class="text-2xl font-bold mb-3">¿Eliminar «{{ servicio.titulo }}»?</h1>
  <p class="text-slate-600 mb-5">Esta acción no se puede deshacer.</p>
  <form method="POST" class="flex gap-4 items-center">
    {% csrf_token %}
    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-semibold px-5 py-2.5 rounded-lg">Sí, eliminar</button>
    <a href="{% url 'servicios' %}" class="text-slate-600 hover:underline">Cancelar</a>
  </form>
</section>
{% endblock %}
