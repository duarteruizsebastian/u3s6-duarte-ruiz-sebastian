{% extends 'core/base.html' %}
{% block titulo %}{{ titulo_pagina }}{% endblock %}
{% block contenido %}
<div class="mx-auto max-w-lg bg-white p-7 rounded-xl border border-slate-200 shadow-sm">
  <h1 class="text-2xl font-bold mb-4">{{ titulo_pagina }}</h1>
  <form method="POST" class="space-y-4">
    {% csrf_token %}
    {{ form.as_p }}
    <div class="flex gap-4 items-center pt-2">
      <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-5 py-2.5 rounded-lg">Guardar</button>
      <a href="{% url 'servicios' %}" class="text-slate-600 hover:underline">Cancelar</a>
    </div>
  </form>
</div>
{% endblock %}
